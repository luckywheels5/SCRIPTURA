name: scriptura_app
description: "Scriptura - Aplicativo Bíblico Devocional (Versão ACF)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Ícones
  cupertino_icons: ^1.0.8

  # Gerenciamento de Estado
  flutter_riverpod: ^2.6.1

  # Banco de Dados SQLite (Mobile & Desktop)
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4

  # Caminhos e arquivos
  path: ^1.9.0
  path_provider: ^2.1.5

  # Preferências locais (chave-valor)
  shared_preferences: ^2.3.4

  # Utilitários de ID e Data
  uuid: ^4.5.1
  intl: '>=0.19.0 <0.21.0'
  sqflite_common_ffi_web: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/database/biblia_acf.db
